<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" role="img" aria-label="学生活动中心">
  <defs>
    <linearGradient id="a-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e9f2ea"/><stop offset="1" stop-color="#f8f1e2"/>
    </linearGradient>
    <linearGradient id="a-glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#bcd8d4"/><stop offset="1" stop-color="#88b3b2"/>
    </linearGradient>
    <linearGradient id="a-wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f2e6cf"/><stop offset="1" stop-color="#e2cfae"/>
    </linearGradient>
    <linearGradient id="a-roof" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#b5654a"/><stop offset="1" stop-color="#9c5039"/>
    </linearGradient>
  </defs>
  <rect width="640" height="480" rx="28" fill="url(#a-sky)"/>
  <ellipse cx="320" cy="402" rx="252" ry="34" fill="#1d3a33" opacity=".10"/>
  <!-- 主楼 -->
  <rect x="118" y="196" width="404" height="196" rx="10" fill="url(#a-wall)"/>
  <rect x="118" y="176" width="404" height="28" rx="10" fill="url(#a-roof)"/>
  <rect x="142" y="224" width="86" height="66" rx="6" fill="url(#a-glass)"/>
  <rect x="244" y="224" width="86" height="66" rx="6" fill="url(#a-glass)"/>
  <rect x="346" y="224" width="86" height="66" rx="6" fill="url(#a-glass)"/>
  <rect x="448" y="224" width="50" height="66" rx="6" fill="url(#a-glass)"/>
  <!-- 弧形玻璃门厅 -->
  <path d="M250 392 v-92 a70 70 0 0 1 140 0 v92 z" fill="url(#a-glass)"/>
  <path d="M262 392 v-88 a58 58 0 0 1 116 0 v88" fill="none" stroke="#f7f2e8" stroke-width="5" opacity=".7"/>
  <rect x="306" y="330" width="28" height="62" rx="4" fill="#2f6f5e" opacity=".55"/>
  <!-- 横幅与彩旗 -->
  <rect x="150" y="150" width="150" height="22" rx="6" fill="#d98a7a"/>
  <text x="225" y="166" font-size="14" text-anchor="middle" fill="#fdf6e6" font-family="'Microsoft YaHei',sans-serif" letter-spacing="3">社团招新</text>
  <path d="M118 150 q80 62 0 118" fill="none" stroke="#2f6f5e" stroke-width="4"/>
  <g fill="#e8b64c">
    <path d="M118 150 l-16 26 l32 0 z"/><path d="M118 196 l-16 26 l32 0 z" fill="#d98a7a"/>
    <path d="M118 242 l-16 26 l32 0 z" fill="#7fa8b3"/>
  </g>
  <path d="M118 150 l80 0" stroke="#2f6f5e" stroke-width="4"/>
  <!-- 台阶 -->
  <rect x="238" y="392" width="164" height="10" rx="4" fill="#d8c7a5"/>
  <rect x="226" y="402" width="188" height="10" rx="4" fill="#cdbb98"/>
  <!-- 树 -->
  <g fill="#3f7d64">
    <circle cx="86" cy="360" r="30"/><circle cx="70" cy="382" r="22"/><circle cx="104" cy="384" r="20"/>
    <circle cx="556" cy="356" r="30"/><circle cx="572" cy="380" r="22"/><circle cx="540" cy="382" r="20"/>
  </g>
  <rect x="82" y="382" width="8" height="30" fill="#6b4a2b"/><rect x="552" y="378" width="8" height="32" fill="#6b4a2b"/>
</svg>
