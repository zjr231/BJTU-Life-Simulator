  <path d="M170 250 q150 18 300 0" fill="none" stroke="#8a6a44" stroke-width="3"/>
  <g>
    <rect x="222" y="250" width="18" height="26" rx="3" fill="#d98a7a"/><rect x="288" y="254" width="18" height="26" rx="3" fill="#7fa8b3"/>
    <rect x="354" y="254" width="18" height="26" rx="3" fill="#f0c65a"/><rect x="420" y="250" width="18" height="26" rx="3" fill="#9fc4c8"/>
