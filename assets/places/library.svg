<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" role="img" aria-label="图书馆">
  <defs>
    <linearGradient id="l-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e8f1ec"/><stop offset="1" stop-color="#f8f1e2"/>
    </linearGradient>
    <linearGradient id="l-tower" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f4ecdc"/><stop offset=".5" stop-color="#e6dcc6"/><stop offset="1" stop-color="#d3c5aa"/>
    </linearGradient>
    <linearGradient id="l-glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a9cbc8"/><stop offset="1" stop-color="#7ba4aa"/>
    </linearGradient>
  </defs>
  <rect width="640" height="480" rx="28" fill="url(#l-sky)"/>
  <ellipse cx="320" cy="414" rx="240" ry="26" fill="#1d3a33" opacity=".10"/>
  <!-- 底座 -->
  <rect x="96" y="352" width="448" height="62" rx="8" fill="#e5d2ae"/>
  <rect x="96" y="344" width="448" height="16" rx="8" fill="#b5654a"/>
  <!-- 圆柱塔楼 -->
  <g>
    <rect x="150" y="176" width="76" height="176" fill="url(#l-tower)"/>
    <ellipse cx="188" cy="176" rx="38" ry="12" fill="#f4ecdc"/>
    <rect x="250" y="136" width="140" height="216" fill="url(#l-tower)"/>
    <ellipse cx="320" cy="136" rx="70" ry="18" fill="#f4ecdc"/>
    <rect x="414" y="176" width="76" height="176" fill="url(#l-tower)"/>
    <ellipse cx="452" cy="176" rx="38" ry="12" fill="#f4ecdc"/>
  </g>
  <!-- 玻璃横带 -->
  <g fill="url(#l-glass)" opacity=".9">
    <rect x="160" y="206" width="56" height="10" rx="3"/><rect x="160" y="236" width="56" height="10" rx="3"/>
    <rect x="160" y="266" width="56" height="10" rx="3"/><rect x="160" y="296" width="56" height="10" rx="3"/>
    <rect x="264" y="180" width="112" height="12" rx="3"/><rect x="264" y="214" width="112" height="12" rx="3"/>
    <rect x="264" y="248" width="112" height="12" rx="3"/><rect x="264" y="282" width="112" height="12" rx="3"/>
    <rect x="424" y="206" width="56" height="10" rx="3"/><rect x="424" y="236" width="56" height="10" rx="3"/>
    <rect x="424" y="266" width="56" height="10" rx="3"/><rect x="424" y="296" width="56" height="10" rx="3"/>
  </g>
  <!-- 中央入口 -->
  <rect x="296" y="316" width="48" height="36" rx="4" fill="#2f6f5e" opacity=".65"/>
  <!-- 书 -->
  <g transform="translate(320 372)">
    <rect x="-58" y="0" width="116" height="18" rx="3" fill="#b5654a"/>
    <rect x="-50" y="-16" width="100" height="16" rx="3" fill="#e8b64c"/>
    <rect x="-42" y="-30" width="84" height="14" rx="3" fill="#2f6f5e"/>
    <rect x="-34" y="-42" width="68" height="12" rx="3" fill="#d98a7a"/>
  </g>
  <!-- 树 -->
  <g fill="#3f7d64">
    <circle cx="70" cy="380" r="26"/><circle cx="52" cy="400" r="18"/>
    <circle cx="570" cy="378" r="26"/><circle cx="588" cy="398" r="18"/>
  </g>
</svg>
