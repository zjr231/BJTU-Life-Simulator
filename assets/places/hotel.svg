<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" role="img" aria-label="红果园宾馆">
  <defs>
    <linearGradient id="ho-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f0ece2"/><stop offset="1" stop-color="#f8f1e2"/>
    </linearGradient>
    <linearGradient id="ho-wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f7ecd8"/><stop offset="1" stop-color="#e6d2ae"/>
    </linearGradient>
    <linearGradient id="ho-glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b7d3d3"/><stop offset="1" stop-color="#8db1b5"/>
    </linearGradient>
  </defs>
  <rect width="640" height="480" rx="28" fill="url(#ho-sky)"/>
  <ellipse cx="320" cy="406" rx="240" ry="28" fill="#1d3a33" opacity=".10"/>
  <!-- 楼体 -->
  <rect x="160" y="180" width="320" height="226" rx="10" fill="url(#ho-wall)"/>
  <rect x="160" y="160" width="320" height="28" rx="10" fill="#9a4f38"/>
  <g fill="url(#ho-glass)">
    <rect x="186" y="208" width="52" height="36" rx="3"/><rect x="256" y="208" width="52" height="36" rx="3"/>
    <rect x="326" y="208" width="52" height="36" rx="3"/><rect x="396" y="208" width="52" height="36" rx="3"/>
    <rect x="186" y="266" width="52" height="36" rx="3"/><rect x="256" y="266" width="52" height="36" rx="3"/>
    <rect x="326" y="266" width="52" height="36" rx="3"/><rect x="396" y="266" width="52" height="36" rx="3"/>
  </g>
  <!-- 遮阳篷 -->
  <path d="M220 322 h200 l18 28 h-236 z" fill="#b5654a"/>
  <g fill="#f7d98a">
    <path d="M232 322 h24 l-6 28 h-24 z"/><path d="M280 322 h24 l-6 28 h-24 z"/>
    <path d="M328 322 h24 l-6 28 h-24 z"/><path d="M376 322 h24 l-6 28 h-24 z"/>
  </g>
  <!-- 门 -->
  <rect x="288" y="350" width="64" height="56" rx="4" fill="#2f6f5e" opacity=".55"/>
  <!-- 苹果招牌 -->
  <g transform="translate(480 200)">
    <circle cx="0" cy="0" r="26" fill="#c0392b"/>
    <path d="M0 -24 q4 -14 14 -18" stroke="#3f7d64" stroke-width="4" fill="none" stroke-linecap="round"/>
    <ellipse cx="10" cy="-30" rx="10" ry="6" fill="#4f8f6d" transform="rotate(-24 10 -30)"/>
    <rect x="-6" y="6" width="12" height="0" fill="none"/>
  </g>
  <text x="480" y="252" font-size="14" text-anchor="middle" fill="#9a4f38" font-family="'Microsoft YaHei',sans-serif" letter-spacing="2">红果园</text>
  <!-- 行李 -->
  <g transform="translate(230 392)">
    <rect x="0" y="0" width="34" height="26" rx="4" fill="#b5654a"/>
    <rect x="6" y="-6" width="22" height="6" rx="3" fill="#8a6a44"/>
    <circle cx="9" cy="28" r="4" fill="#1d3a33"/><circle cx="25" cy="28" r="4" fill="#1d3a33"/>
  </g>
  <g fill="#3f7d64">
    <circle cx="104" cy="380" r="24"/><circle cx="88" cy="400" r="16"/>
    <circle cx="552" cy="380" r="24"/><circle cx="568" cy="400" r="16"/>
  </g>
</svg>
