<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" role="img" aria-label="逸夫楼">
  <defs>
    <linearGradient id="y-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e8f1ec"/><stop offset="1" stop-color="#f8f1e2"/>
    </linearGradient>
    <linearGradient id="y-wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4ecdc"/><stop offset="1" stop-color="#e3d3b4"/>
    </linearGradient>
    <linearGradient id="y-glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a9cbc8"/><stop offset="1" stop-color="#7ba4aa"/>
    </linearGradient>
  </defs>
  <rect width="640" height="480" rx="28" fill="url(#y-sky)"/>
  <ellipse cx="320" cy="408" rx="240" ry="28" fill="#1d3a33" opacity=".10"/>
  <!-- 主楼 L 形 -->
  <rect x="130" y="210" width="300" height="196" rx="8" fill="url(#y-wall)"/>
  <rect x="130" y="188" width="300" height="28" rx="8" fill="#b5654a"/>
  <rect x="430" y="262" width="90" height="144" rx="8" fill="url(#y-wall)"/>
  <rect x="430" y="244" width="90" height="24" rx="8" fill="#9a4f38"/>
  <!-- 窗阵 -->
  <g fill="url(#y-glass)">
    <rect x="152" y="238" width="40" height="26" rx="3"/><rect x="206" y="238" width="40" height="26" rx="3"/>
    <rect x="260" y="238" width="40" height="26" rx="3"/><rect x="314" y="238" width="40" height="26" rx="3"/>
    <rect x="368" y="238" width="40" height="26" rx="3"/>
    <rect x="152" y="286" width="40" height="26" rx="3"/><rect x="206" y="286" width="40" height="26" rx="3"/>
    <rect x="260" y="286" width="40" height="26" rx="3"/><rect x="314" y="286" width="40" height="26" rx="3"/>
    <rect x="368" y="286" width="40" height="26" rx="3"/>
    <rect x="448" y="290" width="26" height="22" rx="3"/><rect x="486" y="290" width="18" height="22" rx="3"/>
    <rect x="448" y="330" width="26" height="22" rx="3"/><rect x="486" y="330" width="18" height="22" rx="3"/>
  </g>
  <!-- 门 -->
  <rect x="256" y="340" width="48" height="66" rx="4" fill="#2f6f5e" opacity=".62"/>
  <!-- 烧瓶标志 -->
  <g transform="translate(330 360)">
    <path d="M-10 -34 h20 v14 l14 26 a10 10 0 0 1 -9 15 h-30 a10 10 0 0 1 -9 -15 l14 -26 z" fill="#9fc4c8" stroke="#2f6f5e" stroke-width="3"/>
    <path d="M-13 4 h26 l6 12 a6 6 0 0 1 -6 9 h-26 a6 6 0 0 1 -6 -9 z" fill="#7fb069" opacity=".8"/>
  </g>
  <!-- 台阶 -->
  <rect x="240" y="406" width="80" height="10" rx="4" fill="#d8c7a5"/>
  <!-- 树 -->
  <g fill="#3f7d64">
    <circle cx="86" cy="384" r="24"/><circle cx="70" cy="404" r="16"/>
    <circle cx="560" cy="384" r="24"/><circle cx="576" cy="404" r="16"/>
  </g>
</svg>
