<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" role="img" aria-label="校医院">
  <defs>
    <linearGradient id="h-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e9f2ea"/><stop offset="1" stop-color="#f8f1e2"/>
    </linearGradient>
    <linearGradient id="h-wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbf6ea"/><stop offset="1" stop-color="#ecdfc4"/>
    </linearGradient>
    <linearGradient id="h-glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b7d3d3"/><stop offset="1" stop-color="#8db1b5"/>
    </linearGradient>
  </defs>
  <rect width="640" height="480" rx="28" fill="url(#h-sky)"/>
  <ellipse cx="320" cy="404" rx="230" ry="28" fill="#1d3a33" opacity=".10"/>
  <!-- 主楼 -->
  <rect x="150" y="208" width="340" height="186" rx="12" fill="url(#h-wall)"/>
  <rect x="150" y="188" width="340" height="28" rx="12" fill="#b5654a"/>
  <rect x="120" y="238" width="60" height="156" rx="8" fill="url(#h-wall)"/>
  <rect x="460" y="238" width="60" height="156" rx="8" fill="url(#h-wall)"/>
  <!-- 窗 -->
  <g fill="url(#h-glass)">
    <rect x="176" y="248" width="44" height="30" rx="4"/><rect x="238" y="248" width="44" height="30" rx="4"/>
    <rect x="358" y="248" width="44" height="30" rx="4"/><rect x="420" y="248" width="44" height="30" rx="4"/>
    <rect x="176" y="300" width="44" height="30" rx="4"/><rect x="238" y="300" width="44" height="30" rx="4"/>
    <rect x="358" y="300" width="44" height="30" rx="4"/><rect x="420" y="300" width="44" height="30" rx="4"/>
    <rect x="134" y="258" width="32" height="26" rx="4"/><rect x="134" y="304" width="32" height="26" rx="4"/>
    <rect x="474" y="258" width="32" height="26" rx="4"/><rect x="474" y="304" width="32" height="26" rx="4"/>
  </g>
  <!-- 红十字 -->
  <rect x="304" y="236" width="32" height="96" rx="6" fill="#c0392b"/>
  <rect x="272" y="268" width="96" height="32" rx="6" fill="#c0392b"/>
  <!-- 门 -->
  <rect x="290" y="332" width="60" height="62" rx="6" fill="#2f6f5e" opacity=".62"/>
  <rect x="278" y="394" width="84" height="10" rx="4" fill="#d8c7a5"/>
  <!-- 小树 -->
  <g fill="#3f7d64">
    <circle cx="92" cy="372" r="26"/><circle cx="76" cy="392" r="16"/>
    <circle cx="548" cy="370" r="26"/><circle cx="564" cy="392" r="16"/>
  </g>
  <rect x="88" y="392" width="8" height="24" fill="#6b4a2b"/><rect x="544" y="390" width="8" height="26" fill="#6b4a2b"/>
</svg>
