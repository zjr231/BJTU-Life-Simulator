<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" role="img" aria-label="思源楼">
  <defs>
    <linearGradient id="t-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e6efe9"/><stop offset="1" stop-color="#f8f1e2"/>
    </linearGradient>
    <linearGradient id="t-wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f3e8d2"/><stop offset="1" stop-color="#e5d2ae"/>
    </linearGradient>
    <linearGradient id="t-glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a9cbc8"/><stop offset="1" stop-color="#7ba4aa"/>
    </linearGradient>
    <linearGradient id="t-brick" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#b5654a"/><stop offset="1" stop-color="#9a4f38"/>
    </linearGradient>
  </defs>
  <rect width="640" height="480" rx="28" fill="url(#t-sky)"/>
  <ellipse cx="320" cy="416" rx="220" ry="26" fill="#1d3a33" opacity=".10"/>
  <!-- 两翼 -->
  <rect x="96" y="262" width="150" height="150" rx="8" fill="url(#t-wall)"/>
  <rect x="96" y="244" width="150" height="24" rx="8" fill="url(#t-brick)"/>
  <rect x="394" y="262" width="150" height="150" rx="8" fill="url(#t-wall)"/>
  <rect x="394" y="244" width="150" height="24" rx="8" fill="url(#t-brick)"/>
  <g fill="url(#t-glass)">
    <rect x="116" y="286" width="34" height="26" rx="3"/><rect x="162" y="286" width="34" height="26" rx="3"/>
    <rect x="208" y="286" width="20" height="26" rx="3"/>
    <rect x="116" y="326" width="34" height="26" rx="3"/><rect x="162" y="326" width="34" height="26" rx="3"/>
    <rect x="208" y="326" width="20" height="26" rx="3"/>
    <rect x="414" y="286" width="34" height="26" rx="3"/><rect x="460" y="286" width="34" height="26" rx="3"/>
    <rect x="506" y="286" width="20" height="26" rx="3"/>
    <rect x="414" y="326" width="34" height="26" rx="3"/><rect x="460" y="326" width="34" height="26" rx="3"/>
    <rect x="506" y="326" width="20" height="26" rx="3"/>
  </g>
  <!-- 主楼 -->
  <rect x="238" y="150" width="164" height="262" rx="10" fill="url(#t-wall)"/>
  <rect x="238" y="132" width="164" height="26" rx="10" fill="url(#t-brick)"/>
  <rect x="256" y="168" width="128" height="24" rx="4" fill="#fdf6e6"/>
  <text x="320" y="186" font-size="16" text-anchor="middle" fill="#9a4f38" font-family="'Microsoft YaHei',sans-serif" letter-spacing="6">思源楼</text>
  <!-- 钟 -->
  <circle cx="320" cy="228" r="26" fill="#fdf6e6" stroke="#9a4f38" stroke-width="3"/>
  <path d="M320 212 v16 l10 8" stroke="#9a4f38" stroke-width="3" fill="none" stroke-linecap="round"/>
  <g fill="url(#t-glass)">
    <rect x="256" y="264" width="30" height="24" rx="3"/><rect x="305" y="264" width="30" height="24" rx="3"/><rect x="354" y="264" width="30" height="24" rx="3"/>
    <rect x="256" y="302" width="30" height="24" rx="3"/><rect x="305" y="302" width="30" height="24" rx="3"/><rect x="354" y="302" width="30" height="24" rx="3"/>
    <rect x="256" y="340" width="30" height="24" rx="3"/><rect x="354" y="340" width="30" height="24" rx="3"/>
  </g>
  <rect x="300" y="338" width="40" height="74" rx="4" fill="#2f6f5e" opacity=".6"/>
  <!-- 台阶 -->
  <rect x="286" y="412" width="68" height="10" rx="4" fill="#d8c7a5"/>
  <rect x="272" y="422" width="96" height="10" rx="4" fill="#cdbb98"/>
  <!-- 树 -->
  <g fill="#3f7d64">
    <circle cx="80" cy="392" r="26"/><circle cx="62" cy="410" r="18"/>
    <circle cx="560" cy="390" r="26"/><circle cx="578" cy="410" r="18"/>
  </g>
</svg>
