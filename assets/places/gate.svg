      <stop offset="0" stop-color="#e7f0ea"/><stop offset="1" stop-color="#f8f1e2"/>
    </linearGradient>
    <linearGradient id="g-stone" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4ecdc"/><stop offset="1" stop-color="#d9c9a8"/>
    </linearGradient>
  </defs>
  <rect width="640" height="480" rx="28" fill="url(#g-sky)"/>
  <ellipse cx="320" cy="412" rx="250" ry="26" fill="#1d3a33" opacity=".10"/>
