<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>北交人生 · 校园地图</title>
  <meta name="theme-color" content="#142b25">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="北交人生">
  <meta name="format-detection" content="telephone=no">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="game-shell" aria-label="北交人生校园地图">
    <section class="map-screen" id="mapScreen">
      <div class="map-layer" id="mapLayer">
        <img class="map-art" src="assets/campus-map-reference.png" alt="北交大主校区地点交互地图">
        <div class="map-wash"></div>
        <div class="npc-layer" id="npcLayer" aria-hidden="true"></div>

        <button class="map-hotspot hotspot-activity" data-place="activity" aria-label="进入学生活动中心">
          <span class="pin-ring"><span class="pin-core"></span></span>
          <span class="pin-label">学生活动中心</span>
        </button>
        <button class="map-hotspot hotspot-think" data-place="think" aria-label="进入思源楼">
          <span class="pin-ring"><span class="pin-core"></span></span>
          <span class="pin-label">思源楼</span>
        </button>
        <button class="map-hotspot hotspot-library" data-place="library" aria-label="进入图书馆">
          <span class="pin-ring"><span class="pin-core"></span></span>
          <span class="pin-label">图书馆</span>
        </button>
        <button class="map-hotspot hotspot-hospital" data-place="hospital" aria-label="进入校医院">
          <span class="pin-ring"><span class="pin-core"></span></span>
          <span class="pin-label">校医院</span>
        </button>
        <button class="map-hotspot hotspot-gate" data-place="gate" aria-label="进入南门">
          <span class="pin-ring"><span class="pin-core"></span></span>
          <span class="pin-label">南门</span>
        </button>
        <button class="map-hotspot hotspot-track" data-place="track" aria-label="进入操场">
          <span class="pin-ring"><span class="pin-core"></span></span>
          <span class="pin-label">操场</span>
        </button>
        <button class="map-hotspot hotspot-auditorium" data-place="auditorium" aria-label="进入天佑会堂">
          <span class="pin-ring"><span class="pin-core"></span></span>
          <span class="pin-label">天佑会堂</span>
        </button>
        <button class="map-hotspot hotspot-ginkgo" data-place="ginkgo" aria-label="进入银杏大道">
          <span class="pin-ring"><span class="pin-core"></span></span>
          <span class="pin-label">银杏大道</span>
        </button>
        <button class="map-hotspot hotspot-yifu" data-place="yifu" aria-label="进入逸夫楼">
          <span class="pin-ring"><span class="pin-core"></span></span>
          <span class="pin-label">逸夫楼</span>
        </button>
        <button class="map-hotspot hotspot-dorm" data-place="dorm" aria-label="进入宿舍">
          <span class="pin-ring"><span class="pin-core"></span></span>
          <span class="pin-label">宿舍</span>
        </button>
        <button class="map-hotspot hotspot-hotel" data-place="hotel" aria-label="进入红果园宾馆">
          <span class="pin-ring"><span class="pin-core"></span></span>
          <span class="pin-label">红果园宾馆</span>
        </button>
      </div>

      <header class="hud-top">
        <div class="brand-lockup">
          <span class="brand-mark">北</span>
          <div>
            <p class="eyebrow" id="playerLabel">北交人生 · 等待入学</p>
            <h1>校园地图</h1>
          </div>
        </div>
        <div class="term-chip"><span class="term-dot"></span><span id="termLabel">大一上 · 第 1 学期</span></div>
      </header>

      <aside class="status-card" aria-label="五项角色属性与当前资源">
        <div class="status-head"><span>角色状态</span><div class="resource-labels"><span class="status-count" id="timeLabel">时间 12 / 12</span><span class="status-count" id="energyLabel">精力 80 / 100</span></div></div>
        <div class="status-grid" id="mapStats"></div>
        <div class="preparation-row"><label for="preparationMeter">本学期学习进度 <b id="preparationValue">0 / 100</b></label><progress id="preparationMeter" max="100" value="0"></progress><span>期末成绩来源</span></div>
        <div class="direction-brief" id="directionBrief" aria-label="毕业方向与事件链进度"></div>
        <div class="status-controls">
          <button class="end-term-button" id="endTermButton" type="button">结束学期</button>
          <button class="history-button" id="historyButton" type="button">查看成长记录</button>
          <button class="utility-button" id="saveButton" type="button">保存进度</button>
          <button class="utility-button" id="loadButton" type="button">读取进度</button>
          <button class="utility-button" id="soundButton" type="button">声音:开</button>
          <button class="utility-button" id="backgroundButton" type="button">入学背景</button>
          <button class="utility-button" id="helpButton" type="button">玩法说明</button>
          <button class="utility-button" id="restartButton" type="button">重新开始</button>
          <p class="session-note" id="sessionNote" role="status">入学后就能保存进度了。</p>
        </div>
        <div id="debugPanel" hidden><p id="debugSummary"></p><button type="button" class="utility-button" id="exportLogButton">导出复现日志</button></div>
      </aside>

      <div class="map-caption">
        <span class="caption-line"></span>
        <span>学习 · 项目 · 社团 · 实习 · 校园生活</span>
      </div>
    </section>

    <section class="place-screen" id="placeScreen" aria-hidden="true" inert>
      <div class="place-backdrop" id="placeBackdrop"></div>
      <div class="place-content">
        <button class="back-button" id="backButton" type="button"><span aria-hidden="true">←</span> 返回地图</button>
        <div class="place-kicker" id="placeKicker">主校区 · 地点</div>
        <h2 id="placeTitle">思源楼</h2>
        <p class="place-description" id="placeDescription">这栋楼，装着你的课程与自习。</p>
        <div class="place-status" id="placeStats" aria-label="当前资源"></div>
        <div class="action-feedback" id="actionFeedback" role="status" aria-live="polite"></div>
        <div class="action-list" id="actionList"></div>
      </div>
      <div class="place-stamp" aria-hidden="true">CAMPUS<br><span>北交人生</span></div>
    </section>

    <dialog class="term-dialog" id="termDialog" aria-labelledby="dialogTitle">
      <div class="dialog-kicker">北交人生 · 学期回顾</div>
      <button type="button" class="dialog-save utility-button" id="dialogSave" hidden>保存当前进度</button>
      <h2 id="dialogTitle" tabindex="-1"></h2>
      <div id="dialogBody"></div>
      <p id="dialogNotice" role="status" aria-live="polite"></p>
      <div class="dialog-buttons" id="dialogButtons"></div>
    </dialog>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>
  </main>
  <script src="config.js"></script>
  <script src="rng.js"></script>
  <script src="state-validation.js"></script>
  <script src="game.js"></script>
  <script src="save.js"></script>
  <script src="audio.js"></script>
  <script src="sms.js"></script>
  <script src="npc.js"></script>
  <script src="app.js"></script>
</body>
</html>
